<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配件庫存與尺寸查詢系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 自訂深色模式滾動條 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

    /* 隱藏 number 輸入框的上下箭頭 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- ==================== 左側側邊欄選單 ==================== -->
  <aside class="w-full md:w-64 bg-gray-900 border-b md:border-b-0 md:border-r border-gray-800 flex-shrink-0 p-4 flex flex-col justify-between">
    <div>
      <!-- 系統 Title -->
      <div class="flex items-center space-x-3 mb-8 px-2">
        <span class="text-lg font-bold tracking-wide text-white">配件管理系統</span>
      </div>

      <!-- 選單列表 -->
      <nav class="space-y-1">
        <a href="#" id="nav-spec" 
           class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition cursor-default">
          <span>配件查詢</span>
        </a>
      </nav>
    </div>

    <!-- 左下角：新增資料按鈕 (+ 圖示) -->
    <div class="mt-8 pt-4 border-t border-gray-800 px-1">
      <button onclick="openAddModal()" 
              class="w-full flex items-center justify-center space-x-2 bg-gray-800 hover:bg-green-600 text-gray-300 hover:text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 border border-gray-700 hover:border-green-500 shadow-md">
        <!-- SVG + 圖示 -->
        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>新增資料</span>
      </button>
    </div>
  </aside>

  <!-- ==================== 右側主內容區 ==================== -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <div class="max-w-3xl mx-auto space-y-6">

      <!-- 頁面標題與三個獨立搜尋按鈕 -->
      <div class="border-b border-gray-800 pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h1 class="text-2xl font-bold text-white">配件資料查詢</h1>
        
        <!-- 🌟 三個選擇方塊 (已將「尺寸查詢」設為預設亮燈) -->
        <div class="flex bg-gray-900 p-1 rounded-lg border border-gray-800 text-xs font-semibold gap-1">
          <button id="tabBtnPartNo" onclick="switchSearchTab('partNo')" class="px-3 py-1.5 rounded-md text-gray-400 hover:text-white transition">
            料號查詢
          </button>
          <button id="tabBtnName" onclick="switchSearchTab('name')" class="px-3 py-1.5 rounded-md text-gray-400 hover:text-white transition">
            名稱查詢
          </button>
          <button id="tabBtnSpec" onclick="switchSearchTab('spec')" class="px-3 py-1.5 rounded-md bg-blue-600 text-white transition">
            尺寸查詢
          </button>
        </div>
      </div>

      <!-- 🌟 搜尋卡片 1：料號查詢 (預設隱藏) -->
      <div id="searchBoxPartNo" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4 shadow-xl">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">料號關鍵字</label>
          <input type="text" id="inputPartNo" placeholder="請輸入完整或部分料號 (例如: SA07-1001)..." 
                 class="w-full bg-gray-950 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex flex-col sm:flex-row gap-2 pt-2">
          <button onclick="handleSearch('part_no')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-blue-600/30">
            查詢料號
          </button>
          <button onclick="clearInputs()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2.5 rounded-lg transition">
            清除輸入
          </button>
        </div>
      </div>

      <!-- 🌟 搜尋卡片 2：名稱查詢 (預設隱藏) -->
      <div id="searchBoxName" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4 shadow-xl">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">名稱關鍵字</label>
          <input type="text" id="inputName" placeholder="請輸入配件名稱 (例如: 墊圈、螺帽)..." 
                 class="w-full bg-gray-950 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex flex-col sm:flex-row gap-2 pt-2">
          <button onclick="handleSearch('name')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-blue-600/30">
            查詢名稱
          </button>
          <button onclick="clearInputs()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2.5 rounded-lg transition">
            清除輸入
          </button>
        </div>
      </div>

      <!-- 🌟 搜尋卡片 3：尺寸查詢 (改為預設顯示) -->
      <div id="searchBoxSpec" class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4 shadow-xl">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">長度</label>
            <input type="number" id="inputLength" placeholder="" 
                   class="w-full bg-gray-950 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">內徑</label>
            <input type="number" id="inputInner" placeholder="" 
                   class="w-full bg-gray-950 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">外徑</label>
            <input type="number" id="inputOuter" placeholder="" 
                   class="w-full bg-gray-950 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 pt-2">
          <button onclick="handleSpecSearch()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-blue-600/30">
            查詢尺寸
          </button>
          <button onclick="clearInputs()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2.5 rounded-lg transition">
            清除輸入
          </button>
        </div>
      </div>

      <!-- 狀態提示：讀取中 -->
      <div id="loading" class="hidden text-center text-gray-400 py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-700 border-t-blue-500 mb-2"></div>
        <p>正在搜尋符合條件的配件資料...</p>
      </div>

      <!-- 狀態提示：無結果 -->
      <div id="notFound" class="hidden bg-red-950/40 border border-red-800/50 rounded-xl p-6 text-center text-red-400">
        ❌ 查無符合條件的配件資料，請調整條件後重試。
      </div>

      <!-- 查詢結果列表容器 -->
      <div id="resultContainer" class="space-y-4"></div>

    </div>
  </main>

  <!-- ==================== 新增資料彈窗 (Modal) ==================== -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-lg p-6 space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
      
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="text-lg font-bold text-white">➕ 新增配件資料</h3>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <!-- 表單內容 -->
      <form id="addForm" onsubmit="submitNewData(event)" class="space-y-3 text-sm">
        
        <!-- 密碼輸入驗證 -->
        <div class="bg-blue-950/40 border border-blue-800/50 p-3 rounded-lg">
          <label class="block text-xs font-semibold text-blue-300 mb-1">密碼 <span class="text-red-400">*</span></label>
          <input type="password" id="addPassword" required placeholder="密碼" 
                 class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
        </div>

        <!-- 必填欄位：料號 -->
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">料號 <span class="text-red-400">*必填</span></label>
          <input type="text" id="addPartNo" required placeholder="SA07-1001" 
                 class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
        </div>

        <!-- 基本欄位 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">名稱(name)</label>
            <input type="text" id="addName" placeholder="" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">種類 (category)</label>
            <input type="text" id="addCategory" placeholder="" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- 尺寸數據 -->
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">長度 (length)</label>
            <input type="number" step="any" id="addLength" placeholder="10" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">內徑 (inner_dia)</label>
            <input type="number" step="any" id="addInner" placeholder="5" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">外徑 (outer_dia)</label>
            <input type="number" step="any" id="addOuter" placeholder="15" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- 位置與條碼 -->
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">當前儲位 (location_in)</label>
            <input type="text" id="addLocIn" placeholder="A-01" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">外部位置 (location_out)</label>
            <input type="text" id="addLocOut" placeholder="B-02" 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">條碼 (barcode)</label>
            <input type="text" id="addBarcode" placeholder="8801234..." 
                   class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- 規格與備註 -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">規格簡述 (spec)</label>
          <input type="text" id="addSpec" placeholder="例: 10*5*15" 
                 class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">詳細規格 (spec_detail)</label>
          <input type="text" id="addSpecDetail" placeholder=" " 
                 class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">備註說明 (notes)</label>
          <textarea id="addNotes" rows="2" placeholder="其它說明..." 
                    class="w-full bg-gray-950 border border-gray-700 text-white rounded px-3 py-1.5 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <!-- 按鈕區 -->
        <div class="flex gap-2 pt-3 border-t border-gray-800">
          <button type="submit" id="btnSubmitAdd" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-semibold py-2 rounded transition">
            儲存寫入
          </button>
          <button type="button" onclick="closeAddModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2 rounded transition">
            取消
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- ==================== JavaScript 邏輯 ==================== -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxHU5AuWKKx-MrG_DZBmAd3qXnFs5oL3fLStx_26fkzvC-Sb--faqz3eLm6Oq9zgw_x/exec";

    // 切換三個搜尋頁籤
    function switchSearchTab(tab) {
      const boxPartNo = document.getElementById('searchBoxPartNo');
      const boxName = document.getElementById('searchBoxName');
      const boxSpec = document.getElementById('searchBoxSpec');

      const btnPartNo = document.getElementById('tabBtnPartNo');
      const btnName = document.getElementById('tabBtnName');
      const btnSpec = document.getElementById('tabBtnSpec');

      // 隱藏全部卡片
      boxPartNo.classList.add('hidden');
      boxName.classList.add('hidden');
      boxSpec.classList.add('hidden');

      // 重設按鈕樣式
      const defaultBtnClass = "px-3 py-1.5 rounded-md text-gray-400 hover:text-white transition";
      const activeBtnClass = "px-3 py-1.5 rounded-md bg-blue-600 text-white transition";

      btnPartNo.className = defaultBtnClass;
      btnName.className = defaultBtnClass;
      btnSpec.className = defaultBtnClass;

      // 依選取項目開啟對應卡片與亮燈
      if (tab === 'partNo') {
        boxPartNo.classList.remove('hidden');
        btnPartNo.className = activeBtnClass;
      } else if (tab === 'name') {
        boxName.classList.remove('hidden');
        btnName.className = activeBtnClass;
      } else if (tab === 'spec') {
        boxSpec.classList.remove('hidden');
        btnSpec.className = activeBtnClass;
      }
      hideAllStatus();
    }

    // 1. 處理料號或名稱單項搜尋
    async function handleSearch(type) {
      let keyword = '';
      if (type === 'part_no') {
        keyword = document.getElementById('inputPartNo').value.trim();
        if (!keyword) { alert('請輸入料號關鍵字！'); return; }
      } else if (type === 'name') {
        keyword = document.getElementById('inputName').value.trim();
        if (!keyword) { alert('請輸入名稱關鍵字！'); return; }
      }

      showLoading();

      try {
        const url = `${API_URL}?action=searchKeyword&keyword=${encodeURIComponent(keyword)}&type=${encodeURIComponent(type)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.status === 'success' && result.data && result.data.length > 0) {
          renderResultList(result.data);
        } else {
          showNotFound();
        }
      } catch (err) {
        alert('連線失敗，請確認網路或 API 設定');
        hideAllStatus();
      }
    }

    // 2. 處理尺寸搜尋
    async function handleSpecSearch() {
      const length = document.getElementById('inputLength').value.trim();
      const inner = document.getElementById('inputInner').value.trim();
      const outer = document.getElementById('inputOuter').value.trim();

      if (!length && !inner && !outer) {
        alert('請至少輸入一項尺寸數據（長度、內徑或外徑）！');
        return;
      }

      showLoading();

      try {
        const url = `${API_URL}?action=searchSpec&length=${encodeURIComponent(length)}&inner=${encodeURIComponent(inner)}&outer=${encodeURIComponent(outer)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.status === 'success' && result.data && result.data.length > 0) {
          renderResultList(result.data);
        } else {
          showNotFound();
        }
      } catch (err) {
        alert('連線失敗，請確認網路或 API 設定');
        hideAllStatus();
      }
    }

    // 清除所有輸入欄位
    function clearInputs() {
      document.getElementById('inputPartNo').value = '';
      document.getElementById('inputName').value = '';
      document.getElementById('inputLength').value = '';
      document.getElementById('inputInner').value = '';
      document.getElementById('inputOuter').value = '';
      hideAllStatus();
    }

    // 渲染查詢結果列表
    function renderResultList(dataList) {
      hideAllStatus();
      const container = document.getElementById('resultContainer');
      container.innerHTML = '';

      const countHeader = document.createElement('div');
      countHeader.className = "text-sm text-gray-400 mb-2";
      countHeader.innerText = `🔍 找到 ${dataList.length} 筆符合條件的配件資料：`;
      container.appendChild(countHeader);

      dataList.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4 shadow-xl";

        card.innerHTML = `
          <div class="border-b border-gray-800 pb-3">
            <span class="text-xs font-semibold px-2 py-0.5 bg-blue-900/60 text-blue-300 border border-blue-700/50 rounded-md">
              ${data.category || '未分類'}
            </span>
            <h2 class="text-lg font-bold text-white mt-1">${index + 1}. ${data.name || '未命名配件'}</h2>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-gray-950 p-2.5 rounded border border-gray-800">
              <span class="text-gray-400">料號 (part_no)</span>
              <p class="font-mono font-semibold text-blue-400 mt-0.5">${data.part_no || '-'}</p>
            </div>

            <div class="bg-gray-950 p-2.5 rounded border border-gray-800">
              <span class="text-gray-400">當前儲位 (location_in)</span>
              <p class="font-mono font-extrabold text-amber-400 mt-0.5">${data.location_in || '無'}</p>
            </div>

            <div class="bg-gray-950 p-2.5 rounded border border-gray-800">
              <span class="text-gray-400">規格 (長*內*外)</span>
              <p class="font-semibold text-gray-200 mt-0.5">${data.spec || '-'}</p>
            </div>
            <div class="bg-gray-950 p-2.5 rounded border border-gray-800">
              <span class="text-gray-400">外部位置 (location_out)</span>
              <p class="font-semibold text-orange-400 mt-0.5">${data.location_out || '無'}</p>
            </div>
          </div>

          <div class="bg-gray-950 p-3 rounded border border-gray-800 space-y-1 text-xs text-gray-400">
            <p><strong>條碼：</strong><span class="font-mono text-gray-300">${data.barcode || '-'}</span></p>
            <p><strong>詳細規格：</strong><span class="text-gray-200">${data.spec_detail || '-'}</span></p>
            <p><strong>尺寸細節：</strong>長度 <span class="text-gray-200">${data.length || 0}</span> | 內徑 <span class="text-gray-200">${data.inner_dia || 0}</span> | 外徑 <span class="text-gray-200">${data.outer_dia || 0}</span></p>
            <p><strong>備註說明：</strong><span class="text-gray-300">${data.notes || '無'}</span></p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function showLoading() {
      hideAllStatus();
      document.getElementById('loading').classList.remove('hidden');
    }

    function showNotFound() {
      hideAllStatus();
      document.getElementById('notFound').classList.remove('hidden');
    }

    function hideAllStatus() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('notFound').classList.add('hidden');
      document.getElementById('resultContainer').innerHTML = '';
    }

    // 彈窗控制功能
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addForm').reset();
    }

    // 發送新增資料給後端 API
    async function submitNewData(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSubmitAdd');
      const password = document.getElementById('addPassword').value;
      const partNo = document.getElementById('addPartNo').value.trim();

      if (!partNo) {
        alert("料號為必填欄位！");
        return;
      }

      const itemData = {
        part_no: partNo,
        name: document.getElementById('addName').value.trim(),
        category: document.getElementById('addCategory').value.trim(),
        length: document.getElementById('addLength').value.trim(),
        inner_dia: document.getElementById('addInner').value.trim(),
        outer_dia: document.getElementById('addOuter').value.trim(),
        location_in: document.getElementById('addLocIn').value.trim(),
        location_out: document.getElementById('addLocOut').value.trim(),
        barcode: document.getElementById('addBarcode').value.trim(),
        spec: document.getElementById('addSpec').value.trim(),
        spec_detail: document.getElementById('addSpecDetail').value.trim(),
        notes: document.getElementById('addNotes').value.trim()
      };

      btn.disabled = true;
      btn.innerText = "寫入中...";

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            password: password,
            part_no: partNo,
            itemData: itemData
          })
        });

        const res = await response.json();

        if (res.status === 'success') {
          alert("🎉 " + res.message);
          closeAddModal();
        } else {
          alert("❌ " + res.message);
        }
      } catch (err) {
        alert("連線失敗，請確認 API 設定或網路狀況");
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存寫入";
      }
    }
  </script>
</body>
</html>
